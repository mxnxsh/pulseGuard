# Local development infrastructure for PulseGuard.
# Starts MySQL 8 and Redis 7. Not for production use.
#
# Usage:
#   docker compose up -d
#   docker compose down        (add -v to also remove data volumes)

services:
  mysql:
    image: mysql:8.0
    container_name: pulseguard-mysql
    environment:
      MYSQL_DATABASE: pulseguard_db
      # Local development only. Override via MYSQL_ROOT_PASSWORD env if desired.
      # Must match DB_PASSWORD in your .env (default here matches .env.example note).
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-12345}
    ports:
      - '3306:3306'
    volumes:
      - pulseguard_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${DB_PASSWORD:-12345}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulseguard-redis
    ports:
      - '6379:6379'
    volumes:
      - pulseguard_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pulseguard_mysql_data:
  pulseguard_redis_data:
