# Backend CI — lint + full test suite against a real MySQL + Dockerfile build check.
# Colocated with the backend code; discovered by GitHub Actions when this
# directory is the repo root (post-split) or when symlinked to a root-level
# .github/workflows/ (monorepo mode).
#
# Targets GitHub Actions; the equivalent GitLab / Bitbucket / self-hosted layout
# is a direct translation (service container, run matrix, cached npm cache).

name: Backend CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    # Service containers for integration tests. MySQL is required; Redis is
    # optional because the queue is off by default (QUEUE_ENABLED=false).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: pulseguard_db
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -uroot -prootpw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpw
      DB_NAME: pulseguard_db
      # Dev-default JWT secret; production validation only runs when NODE_ENV=production.
      JWT_SECRET: ci-only-jwt-secret-not-for-production-use
      # Allow private targets for the main test pass (local-server checker tests).
      # The SSRF-blocking pass runs in a separate step with this OFF.
      MONITOR_ALLOW_PRIVATE_TARGETS: 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -prootpw --silent; then
              echo "MySQL ready"; exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready"; exit 1

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Lint
        run: npm run lint

      - name: Tests — SSRF-blocking pass (private targets OFF)
        run: npm run test:ssrf

      - name: Tests — main pass (private targets allowed for local-server tests)
        run: npm run test:main

  docker:
    name: Backend image build check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pulseguard-api:ci-${{ github.sha }}
